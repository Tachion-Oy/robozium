name: "${COMPOSE_PROJECT_NAME:-robozium}"

services:
  api:
    build:
      context: .
      target: api
    environment:
      CEREBRAS_API_KEY_SECRET: "${CEREBRAS_API_KEY_SECRET:-}"
      GROQ_API_KEY_SECRET: "${GROQ_API_KEY_SECRET:-}"
      OPENROUTER_API_KEY_SECRET: "${OPENROUTER_API_KEY_SECRET:-}"
      PEFFAHUB_PROTON_BRIDGE_USERNAME: "${PEFFAHUB_PROTON_BRIDGE_USERNAME:-}"
      PEFFAHUB_PROTON_BRIDGE_PASSWORD_SECRET: "${PEFFAHUB_PROTON_BRIDGE_PASSWORD_SECRET:-}"
      PEFFAHUB_PROTON_BRIDGE_IMAP_HOST: "${PEFFAHUB_PROTON_BRIDGE_IMAP_HOST:-}"
      PEFFAHUB_PROTON_BRIDGE_IMAP_PORT: "${PEFFAHUB_PROTON_BRIDGE_IMAP_PORT:-}"
      PEFFAHUB_PROTON_BRIDGE_TLS_MODE: "${PEFFAHUB_PROTON_BRIDGE_TLS_MODE:-}"
      PEFFAHUB_PROTON_BRIDGE_ACCOUNT_ADDRESS: "${PEFFAHUB_PROTON_BRIDGE_ACCOUNT_ADDRESS:-}"
      PEFFAHUB_PROTON_BRIDGE_CERTIFICATE_SHA256: "${PEFFAHUB_PROTON_BRIDGE_CERTIFICATE_SHA256:-}"
      ROBOZIUM_HUB_ROOT: /hub
      ROBOZIUM_LOG_DIR: /logs
      ROBOZIUM_MODE: "${ROBOZIUM_MODE:-mock}"
    init: true
    stop_grace_period: 30s
    user: "${ROBOZIUM_API_USER:-10001:10001}"
    volumes:
      - type: bind
        source: ./local
        target: /app/local
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${ROBOZIUM_HOST_HUB_DIR:-./.runtime/mock-hub}"
        target: /hub
        bind:
          create_host_path: false
      - type: bind
        source: "${ROBOZIUM_HOST_LOG_DIR:-./.runtime/mock-logs}"
        target: /logs
        bind:
          create_host_path: false

  web:
    build:
      context: .
      target: web
    depends_on:
      api:
        condition: service_healthy
    environment:
      ROBOZIUM_API_BASE_URL: http://api:8000
    init: true
    ports:
      - "127.0.0.1:${ROBOZIUM_WEB_PORT:-6969}:6969"
    stop_grace_period: 30s

  verify:
    build:
      context: .
      target: verify
    depends_on:
      web:
        condition: service_healthy
    environment:
      ROBOZIUM_CONTAINER_BASE_URL: http://web:6969
      ROBOZIUM_CONTAINER_PHASE: "${ROBOZIUM_CONTAINER_PHASE:-onboarding}"
    init: true
    profiles: [verify]
