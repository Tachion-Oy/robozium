name: "${COMPOSE_PROJECT_NAME:-robozium}"

services:
  api:
    build:
      context: .
      target: api
    network_mode: host
    env_file:
      - path: .env
        required: false
      - path: .env.encrypt
        required: false
    environment:
      # Paths inside the API container, not host paths or .env settings.
      ROBOZIUM_HUB_ROOT: /hub
      ROBOZIUM_LOG_DIR: /logs
      # The launcher selects live/mock; no .env entry is needed.
      ROBOZIUM_MODE: "${ROBOZIUM_MODE:-mock}"
      # Container path to the mounted host socket; no .env entry is needed.
      ROBOZIUM_HOST_SCRIPT_SOCKET: /host-scripts/scripts.sock
    init: true
    stop_grace_period: 30s
    user: "${ROBOZIUM_API_USER:-10001:10001}"
    # Each source is on the host; each target is inside the container.
    # The launcher supplies ROBOZIUM_HOST_* paths for the selected mode.
    # Optional ROBOZIUM_HUB_ROOT in .env/.env.encrypt changes the live host
    # hub location only; the container still uses /hub.
    volumes:
      - type: bind
        source: ./local
        target: /app/local
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.runtime/local-deps
        target: /app/.runtime/local-deps
        bind:
          create_host_path: false
      - type: bind
        source: "${ROBOZIUM_HOST_HUB_DIR:-./.runtime/mock-hub}"
        target: /hub
        bind:
          create_host_path: false
      - type: bind
        source: "${ROBOZIUM_HOST_LOG_DIR:-./.runtime/mock-logs}"
        target: /logs
        bind:
          create_host_path: false
      - type: bind
        source: "${ROBOZIUM_HOST_SOCKET_DIR:-./.runtime/mock-socket}"
        target: /host-scripts
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${ROBOZIUM_HOST_HUB_DIR:-./.runtime/mock-hub}/readonly/safe-scripts"
        target: /hub/readonly/safe-scripts
        read_only: true
        bind:
          create_host_path: false

  web:
    build:
      context: .
      target: web
    network_mode: host
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: "${ROBOZIUM_WEB_PORT:-6969}"
      ROBOZIUM_API_BASE_URL: http://127.0.0.1:8000
    init: true
    stop_grace_period: 30s

  verify:
    build:
      context: .
      target: verify
    network_mode: host
    depends_on:
      web:
        condition: service_healthy
    environment:
      ROBOZIUM_CONTAINER_BASE_URL: "http://127.0.0.1:${ROBOZIUM_WEB_PORT:-6969}"
      ROBOZIUM_CONTAINER_PHASE: "${ROBOZIUM_CONTAINER_PHASE:-onboarding}"
    init: true
    profiles: [verify]
