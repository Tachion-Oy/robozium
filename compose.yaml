name: "${COMPOSE_PROJECT_NAME:-robozium}"

services:
  api:
    build:
      context: .
      target: api
    environment:
      CEREBRAS_API_KEY: "${CEREBRAS_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      ROBOZIUM_HUB_ROOT: /hub
      ROBOZIUM_LOG_DIR: /logs
      ROBOZIUM_MODE: "${ROBOZIUM_MODE:-mock}"
    init: true
    stop_grace_period: 30s
    volumes:
      - robozium-hub:/hub
      - robozium-logs:/logs

  web:
    build:
      context: .
      target: web
    depends_on:
      api:
        condition: service_healthy
    environment:
      ROBOZIUM_API_BASE_URL: http://api:8000
    init: true
    ports:
      - "127.0.0.1:${ROBOZIUM_WEB_PORT:-6969}:6969"
    stop_grace_period: 30s

  verify:
    build:
      context: .
      target: verify
    depends_on:
      web:
        condition: service_healthy
    environment:
      ROBOZIUM_CONTAINER_BASE_URL: http://web:6969
      ROBOZIUM_CONTAINER_PHASE: "${ROBOZIUM_CONTAINER_PHASE:-onboarding}"
    init: true
    profiles: [verify]

volumes:
  robozium-hub:
    name: "${COMPOSE_PROJECT_NAME:-robozium}-${ROBOZIUM_MODE:-mock}-hub"
  robozium-logs:
    name: "${COMPOSE_PROJECT_NAME:-robozium}-${ROBOZIUM_MODE:-mock}-logs"
