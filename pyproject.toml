[project]
name = "robosprawl"
version = "0.1.0"
description = "RoboSprawl: a project agent application built on Roboz"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
  "roboz>=0.1.1,<0.2.0",
  "roboz-shed>=0.1.0a1,<0.2.0",
  "roboz-openai>=0.1.0a1,<0.2.0",
  "fastapi[standard]>=0.135.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.12.5",
]
[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"
[tool.uv.sources]
roboz = { path = "../roboz", editable = false }
roboz-shed = { path = "../roboz/packages/shed", editable = false }
roboz-openai = { path = "../roboz/packages/openai", editable = false }
[tool.pytest.ini_options]
addopts = "--cov=robosprawl --cov-report=term-missing --basetemp=.artifacts/pytest-tmp"
testpaths = ["tests"]
[dependency-groups]
dev = ["pytest>=8.4.1", "pytest-cov>=6.2.1", "httpx>=0.27.0", "ruff>=0.5.0"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.ruff.lint.per-file-ignores]
"src/robosprawl/api/app.py" = ["F403", "F405"]
