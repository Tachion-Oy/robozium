[project]
name = "robozium"
version = "0.1.0"
description = "Robozium: a project agent application built on Roboz"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
  "roboz==0.10.0",
  "fastapi>=0.135.0",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.12.5",
]
[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
addopts = "--cov=robozium --cov-report=term-missing"
testpaths = ["tests/unit", "tests/contract"]
pythonpath = ["."]
[dependency-groups]
dev = ["pytest>=8.4.1", "pytest-cov>=6.2.1", "httpx>=0.27.0", "ruff>=0.5.0", "pyright>=1.1.411", "twine>=6.2"]
host = ["roboz"]

[tool.ruff]
extend-exclude = ["local"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.ruff.lint.per-file-ignores]
"src/robozium/api/app.py" = ["F403", "F405"]

[tool.hatch.build.targets.sdist]
include = ["/src/robozium", "/README.md", "/CHANGELOG.md", "/LICENSE", "/pyproject.toml", "/hub.config.py"]
