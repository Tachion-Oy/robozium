version: "0.5"
ordered_shutdown: true
processes:
  safe-scripts:
    namespace: live-Linux
    command: >-
      uv sync --locked --only-group host --no-install-project --python 3.13 &&
      exec .runtime/host-scripts-venv/bin/python -m roboz.shed.tools.safe_scripts serve
      --socket .runtime/host-socket/scripts.sock
      --scripts "$$ROBOZIUM_HOST_HUB_DIR/readonly/safe-scripts" --cwd "$$ROBOZIUM_HOST_HUB_DIR"
      --timeout-s 600
      --allow-env HOME --allow-env USER --allow-env LOGNAME
      --allow-env XDG_CONFIG_HOME --allow-env XDG_DATA_HOME --allow-env XDG_CACHE_HOME
    environment: [UV_PROJECT_ENVIRONMENT=.runtime/host-scripts-venv]
    is_dotenv_disabled: true
    availability: {restart: on_failure, max_restarts: 2, backoff_seconds: 1}
    shutdown: {signal: 15, timeout_seconds: 10}
    log_location: .runtime/logs/safe-scripts.log
