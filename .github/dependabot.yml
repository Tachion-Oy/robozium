version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    rebase-strategy: disabled
    allow:
      - dependency-name: roboz
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    rebase-strategy: disabled
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Avoid restarting CI on dependency PRs whenever main changes.
    rebase-strategy: disabled
    groups:
      github-actions:
        patterns:
          - "*"
