version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    rebase-strategy: disabled
    allow:
      - dependency-name: roboz
  - package-ecosystem: docker
    directory: /desktop
    schedule:
      interval: weekly
    rebase-strategy: disabled
    # Moving to a new Python version is a deliberate change across CI and the
    # image; newer versions can lack wheels for locked dependencies.
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Avoid restarting CI on dependency PRs whenever main changes.
    rebase-strategy: disabled
    groups:
      github-actions:
        patterns:
          - "*"
