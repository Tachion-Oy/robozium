name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    continue-on-error: ${{ matrix.browser == 'webkit' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: Tachion-Oy/roboz
          ref: f148023af667dc58c842d11f5a93843c2b0f1a8e
          path: .artifacts/dependencies/roboz
          persist-credentials: false
      - name: Install local tooling and adapt source paths
        shell: bash
        run: |
          source scripts/env.sh
          mkdir -p .artifacts/bin
          curl -LsSf https://github.com/astral-sh/uv/releases/download/0.6.14/uv-x86_64-unknown-linux-gnu.tar.gz -o .artifacts/uv.tar.gz
          tar -xzf .artifacts/uv.tar.gz -C .artifacts/bin --strip-components=1
          echo "$PWD/.artifacts/bin" >> "$GITHUB_PATH"
          python3 - <<'PY'
          from pathlib import Path
          for name in ('pyproject.toml', 'uv.lock'):
              p = Path(name)
              p.write_text(p.read_text().replace('../roboz', '.artifacts/dependencies/roboz'))
          PY
      - name: Install dependencies inside checkout
        run: |
          source scripts/env.sh
          uv sync --locked
          npm --prefix web ci
          npm --prefix web exec -- playwright install ${{ matrix.browser }}
      - name: Unit tests and wheel installation
        if: matrix.browser == 'chromium'
        run: |
          source scripts/env.sh
          uv run --locked pytest
          uv run --locked ruff check src tests scripts
          npm --prefix web run test:run
          npm --prefix web run lint
          ./scripts/verify-wheels.sh
      - name: Browser gate (WebKit advisory)
        run: bash scripts/e2e/run-mock-playwright.sh --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.browser }}
          path: |
            web/playwright-report
            web/test-results
            .artifacts/mock-api.log
          retention-days: 7
