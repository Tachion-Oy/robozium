name: Full E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    name: Chromium
    uses: ./.github/workflows/e2e-browser.yml
    with:
      task: suite
      browser: chromium

  firefox:
    name: Firefox
    uses: ./.github/workflows/e2e-browser.yml
    with:
      task: suite
      browser: firefox

  webkit:
    name: WebKit
    uses: ./.github/workflows/e2e-browser.yml
    with:
      task: suite
      browser: webkit
      deadline: 1500
      job_timeout: 35

  installation:
    name: Installation
    uses: ./.github/workflows/e2e-browser.yml
    with:
      task: installation

  runner:
    name: Runner infrastructure
    uses: ./.github/workflows/e2e-browser.yml
    with:
      task: runner

  docker:
    name: Docker onboarding and restart recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: robozium-ci
      ROBOZIUM_MODE: mock
      ROBOZIUM_WEB_PORT: "6971"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.10"
          python-version: "3.13"
          enable-cache: true
      - name: Check Compose configuration
        run: |
          uv sync --locked --dev
          uv run pytest tests/infrastructure/test_runtime_compose.py --no-cov -q
      - name: Docker onboarding and restart recovery
        id: containers
        run: |
          echo "ROBOZIUM_API_USER=$(id -u):$(id -g)" >> "$GITHUB_ENV"
          export ROBOZIUM_API_USER="$(id -u):$(id -g)"
          mkdir -p .runtime/mock-hub/readonly/safe-scripts .runtime/mock-logs .runtime/mock-socket .runtime/local-deps local
          uv run --locked roboz tool init
          uv run --locked roboz skill init
          uv run --locked roboz tool init --path "$RUNNER_TEMP/customer-tools/tools/customer_quotes"
          uv run --locked roboz skill init --path "$RUNNER_TEMP/shared-tools/skills/customer_guide"
          export COMPOSE_FILE=compose.yaml:tests/container/compose.yaml
          echo "COMPOSE_FILE=$COMPOSE_FILE" >> "$GITHUB_ENV"
          docker compose up --build --wait
          docker compose exec -T api python - < tests/container/check_local_capabilities.py
          docker compose exec -T api python - < tests/container/check_file_cli.py
          docker compose run --build --rm verify
          docker compose restart api
          docker compose up --wait --wait-timeout 120
          docker compose exec -T api python - < tests/container/check_local_capabilities.py
          docker compose run --rm -e ROBOZIUM_CONTAINER_PHASE=persistence verify
      - name: Container logs
        if: ${{ failure() && steps.containers.outcome == 'failure' }}
        run: docker compose logs --no-color
      - name: Remove disposable containers
        if: always()
        run: docker compose down --remove-orphans

  full-e2e:
    name: Full E2E
    if: ${{ always() }}
    needs: [chromium, firefox, webkit, installation, runner, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every Full E2E job to succeed
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          results = json.loads(os.environ["REQUIRED_RESULTS"])
          required = {"chromium", "firefox", "webkit", "installation", "runner", "docker"}
          if results.keys() != required or any(job.get("result") != "success" for job in results.values()):
              raise SystemExit(f"Required E2E jobs did not all succeed: {results}")
          PY
