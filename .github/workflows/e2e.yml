name: Full E2E

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Decide whether the application is affected
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # A pull request that changes only documentation skips the checks.
          # Merge queues, pushes and manual runs keep them all. HEAD is the pull
          # request's merge commit; its first parent is the base.
          code=true
          if [ "$EVENT" = pull_request ]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
            grep -qvE '^(docs/|CHANGELOG\.md$)' <<< "$changed" || code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  installation:
    name: Installation
    needs: scope
    if: ${{ needs.scope.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.12.10"
          python-version: "3.13.3"
          enable-cache: true
      - name: Check wheel and source archive
        run: |
          uv sync --locked --dev
          uv build --no-sources --out-dir .artifacts/distributions
          uv run twine check .artifacts/distributions/*
          ROBOZIUM_DIST_DIR=.artifacts/distributions uv run pytest tests/integration --no-cov -q
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: installation-reports
          path: .artifacts/distribution-reports/
          if-no-files-found: ignore
          retention-days: 7

  desktop-backend:
    name: Desktop backend lifecycle
    needs: scope
    if: ${{ needs.scope.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Check desktop backend isolation and restart recovery
        run: |
          npm --prefix desktop run test:backend
          npm --prefix desktop run test:backend:docker
      - name: Install Electron for backend lifecycle checks
        run: |
          npm --prefix desktop ci
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0t64 libnss3 libasound2t64 libgbm1 xvfb
          sudo chown root:root desktop/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 desktop/node_modules/electron/dist/chrome-sandbox
      - name: Exercise native backend startup and shutdown
        run: npm --prefix desktop run test:backend:electron
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: electron-backend-reports
          path: |
            desktop/test-results/
            desktop/playwright-report/
          include-hidden-files: true
          retention-days: 7

  electron:
    name: Electron scaffold (${{ matrix.shard }}/2)
    needs: scope
    if: ${{ needs.scope.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: desktop
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Electron and Linux dependencies
        run: |
          npm --prefix desktop ci
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0t64 libnss3 libasound2t64 libgbm1 xvfb
          # Configure Chromium's sandbox helper on this disposable runner.
          sudo chown root:root desktop/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 desktop/node_modules/electron/dist/chrome-sandbox
      - name: Exercise the native application with sandboxing enabled
        shell: bash
        env:
          DEBUG: pw:browser
        run: |
          set -o pipefail
          mkdir -p .artifacts/desktop
          npm --prefix desktop run test:electron -- --shard=${{ matrix.shard }}/2 2>&1 | tee .artifacts/desktop/electron-launch.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: electron-scaffold-reports-${{ matrix.shard }}
          path: |
            .artifacts/desktop/electron-launch.log
            desktop/test-results/
            desktop/playwright-report/
          include-hidden-files: true
          retention-days: 7

  full-e2e:
    name: Full E2E
    if: ${{ always() }}
    needs: [scope, installation, desktop-backend, electron]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # A job is skipped only when the change scope says so; if the scope job
      # itself fails or is cancelled, that result fails this check.
      - name: Require every job to pass or be skipped by the change scope
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
