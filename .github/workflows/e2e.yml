name: Full E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: "1"
  ROBOZIUM_API_BASE_URL: http://127.0.0.1:8000
  ROBOZIUM_E2E_PREBUILT: "1"
  ROBOZIUM_E2E_PYTHON: ${{ github.workspace }}/.artifacts/browser-backend/bin/python
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.artifacts/browsers
jobs:
  browsers:
    name: ${{ matrix.browser }} browser
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.job_timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            deadline: 900
            job_timeout: 25
          - browser: firefox
            deadline: 900
            job_timeout: 25
          - browser: webkit
            deadline: 1500
            job_timeout: 35
    env:
      ROBOZIUM_E2E_DEADLINE_SECONDS: ${{ matrix.deadline }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.10"
          python-version: "3.13"
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Prepare installed backend
        run: |
          uv sync --locked --dev
          uv build --no-sources --out-dir .artifacts/distributions
          uv venv --python 3.13 .artifacts/browser-backend
          uv export --locked --no-dev --no-emit-project --output-file .artifacts/browser-requirements.txt >/dev/null
          uv pip install --python .artifacts/browser-backend/bin/python --require-hashes --only-binary roboz --requirement .artifacts/browser-requirements.txt
          uv pip install --python .artifacts/browser-backend/bin/python --no-deps .artifacts/distributions/*.whl
      - name: Check wheel and source archive
        if: ${{ matrix.browser == 'chromium' }}
        run: |
          uv run twine check .artifacts/distributions/*
          ROBOZIUM_DIST_DIR=.artifacts/distributions uv run pytest tests/integration --no-cov -q
      - name: Prepare browser tests
        id: prepare
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          npm --prefix web ci
          npm --prefix web run build
          npm --prefix web exec -- playwright install --with-deps "$BROWSER"
      - name: Check runner failure and interruption cleanup
        id: runner_check
        if: ${{ matrix.browser == 'chromium' }}
        run: uv run pytest tests/e2e/test_lifecycle.py --no-cov -s
      - name: Run ${{ matrix.browser }} suite
        id: browser
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && (matrix.browser != 'chromium' || steps.runner_check.outcome == 'success') }}
        run: bash scripts/e2e/run-mock-playwright.sh --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && failure() }}
        with:
          name: e2e-${{ matrix.browser }}-reports
          path: |
            .artifacts/e2e/
            .artifacts/distribution-reports/
          retention-days: 7

  docker:
    name: Docker onboarding and restart recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: robozium-ci
      ROBOZIUM_MODE: mock
      ROBOZIUM_WEB_PORT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Docker onboarding and restart recovery
        id: containers
        run: |
          mkdir -p .runtime/mock-hub .runtime/mock-logs local
          echo "ROBOZIUM_API_USER=$(id -u):$(id -g)" >> "$GITHUB_ENV"
          export ROBOZIUM_API_USER="$(id -u):$(id -g)"
          docker compose up --build --wait
          docker compose run --build --rm verify
          docker compose restart api
          docker compose run --rm -e ROBOZIUM_CONTAINER_PHASE=persistence verify
      - name: Container logs
        if: ${{ failure() && steps.containers.outcome == 'failure' }}
        run: docker compose logs --no-color
      - name: Remove disposable containers
        if: always()
        run: docker compose down --remove-orphans
