name: Full E2E

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      web: ${{ steps.scope.outputs.web }}
      desktop: ${{ steps.scope.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Decide whether the web and desktop applications are affected
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # A pull request skips the jobs of an application it does not touch:
          # desktop-only changes skip the web jobs, web-only changes skip the
          # desktop jobs, and documentation alone skips both. Merge queues,
          # pushes and manual runs keep them all. HEAD is the pull request's
          # merge commit; its first parent is the base.
          web=true desktop=true
          if [ "$EVENT" = pull_request ]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
            grep -qvE '^(desktop/|docs/|CHANGELOG\.md$)' <<< "$changed" || web=false
            grep -qvE '^(web/|docs/|CHANGELOG\.md$)' <<< "$changed" || desktop=false
          fi
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"

  chromium:
    name: Chromium
    needs: scope
    if: ${{ needs.scope.outputs.web == 'true' }}
    uses: ./.github/workflows/e2e-browser.yml
    with:
      task: suite
      browser: chromium

  firefox:
    name: Firefox
    needs: scope
    if: ${{ needs.scope.outputs.web == 'true' }}
    uses: ./.github/workflows/e2e-browser.yml
    with:
      task: suite
      browser: firefox

  webkit:
    name: WebKit
    needs: scope
    if: ${{ needs.scope.outputs.web == 'true' }}
    uses: ./.github/workflows/e2e-browser.yml
    with:
      task: suite
      browser: webkit
      deadline: 1500
      job_timeout: 35

  installation:
    name: Installation
    needs: scope
    if: ${{ needs.scope.outputs.web == 'true' }}
    uses: ./.github/workflows/e2e-browser.yml
    with:
      task: installation

  runner:
    name: Runner infrastructure
    needs: scope
    if: ${{ needs.scope.outputs.web == 'true' }}
    uses: ./.github/workflows/e2e-browser.yml
    with:
      task: runner

  docker:
    name: Docker onboarding and restart recovery
    needs: scope
    if: ${{ needs.scope.outputs.web == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: robozium-ci
      ROBOZIUM_MODE: mock
      ROBOZIUM_WEB_PORT: "6971"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.10"
          python-version: "3.13"
          enable-cache: true
      - name: Check Compose configuration
        run: |
          uv sync --locked --dev
          uv run pytest tests/infrastructure/test_runtime_compose.py --no-cov -q
      - name: Docker onboarding and restart recovery
        id: containers
        run: |
          echo "ROBOZIUM_API_USER=$(id -u):$(id -g)" >> "$GITHUB_ENV"
          export ROBOZIUM_API_USER="$(id -u):$(id -g)"
          mkdir -p .runtime/mock-hub/readonly/safe-scripts .runtime/mock-logs .runtime/mock-socket .runtime/local-deps local
          uv run --locked roboz tool init
          uv run --locked roboz skill init
          uv run --locked roboz tool init --path local/tools/customer_quotes
          uv run --locked roboz skill init --path local/skills/customer_guide
          docker compose up --build --wait
          docker compose exec -T api python - < tests/container/check_local_capabilities.py
          docker compose exec -T api python - < tests/container/check_file_cli.py
          docker compose run --build --rm verify
          docker compose restart api
          docker compose up --wait --wait-timeout 120
          docker compose exec -T api python - < tests/container/check_local_capabilities.py
          docker compose run --rm -e ROBOZIUM_CONTAINER_PHASE=persistence verify
      - name: Container logs
        if: ${{ failure() && steps.containers.outcome == 'failure' }}
        run: docker compose logs --no-color
      - name: Remove disposable containers
        if: always()
        run: docker compose down --remove-orphans

  desktop-backend:
    name: Desktop backend lifecycle
    needs: scope
    if: ${{ needs.scope.outputs.desktop == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Check desktop backend isolation and restart recovery
        run: |
          npm --prefix desktop run test:backend
          npm --prefix desktop run test:backend:docker
      - name: Install Electron for backend lifecycle checks
        run: |
          npm --prefix desktop ci
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0t64 libnss3 libasound2t64 libgbm1 xvfb
          sudo chown root:root desktop/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 desktop/node_modules/electron/dist/chrome-sandbox
      - name: Exercise native backend startup and shutdown
        run: npm --prefix desktop run test:backend:electron
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: electron-backend-reports
          path: |
            desktop/test-results/
            desktop/playwright-report/
          include-hidden-files: true
          retention-days: 7

  electron:
    name: Electron scaffold (${{ matrix.shard }}/2)
    needs: scope
    if: ${{ needs.scope.outputs.desktop == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: desktop
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Electron and Linux dependencies
        run: |
          npm --prefix desktop ci
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0t64 libnss3 libasound2t64 libgbm1 xvfb
          # Configure Chromium's sandbox helper on this disposable runner.
          sudo chown root:root desktop/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 desktop/node_modules/electron/dist/chrome-sandbox
      - name: Exercise the native application with sandboxing enabled
        shell: bash
        env:
          DEBUG: pw:browser
        run: |
          set -o pipefail
          mkdir -p .artifacts/desktop
          npm --prefix desktop run test:electron -- --shard=${{ matrix.shard }}/2 2>&1 | tee .artifacts/desktop/electron-launch.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: electron-scaffold-reports-${{ matrix.shard }}
          path: |
            .artifacts/desktop/electron-launch.log
            desktop/test-results/
            desktop/playwright-report/
          include-hidden-files: true
          retention-days: 7

  full-e2e:
    name: Full E2E
    if: ${{ always() }}
    needs: [scope, chromium, firefox, webkit, installation, runner, docker, desktop-backend, electron]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # A job is skipped only when the change scope says so; if the scope job
      # itself fails or is cancelled, that result fails this check.
      - name: Require every job to pass or be skipped by the change scope
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
