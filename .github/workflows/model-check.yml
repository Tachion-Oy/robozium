name: Model check

# Pings every catalogue model with live credentials, so it never runs on pull requests.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      reword_rationale:
        description: "Experiment: reword the rationale field in the installed roboz prompt"
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: model-check
  cancel-in-progress: false

jobs:
  model-check:
    name: Model check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.12.10"
          python-version: "3.13"
          enable-cache: true
      - name: Ping OpenRouter models
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          uv sync --locked
          if [ "${{ inputs.reword_rationale }}" = "true" ]; then
            uv run python - <<'PY'
          import pathlib, roboz.tooling._prompts as m
          p = pathlib.Path(m.__file__)
          old = "A string explaining your thought process i.e. your internal monologue for why you are taking the chosen action."
          new = "A short statement of the reason behind the chosen action."
          s = p.read_text()
          assert old in s, "rationale wording not found"
          p.write_text(s.replace(old, new))
          print("Reworded rationale:", new)
          PY
          fi
          uv run python scripts/model_check.py --provider openrouter
