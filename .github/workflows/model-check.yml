name: Model check

# Pings every catalogue model with live credentials, so it never runs on pull requests.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: model-check
  cancel-in-progress: false

jobs:
  model-check:
    name: Model check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.10"
          python-version: "3.13"
          enable-cache: true
      - name: Ping OpenRouter models
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          uv sync --locked
          uv run python scripts/model_check.py --provider openrouter
