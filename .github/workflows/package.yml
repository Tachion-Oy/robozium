name: Linux package

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Linux package
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Build the Debian package
        run: |
          npm --prefix desktop ci
          npm --prefix desktop run package:linux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: robozium-desktop-deb
          path: desktop/release/robozium-desktop_*_amd64.deb
          if-no-files-found: error
          retention-days: 14
      - name: Install the package and run its backend in mock mode
        shell: bash
        run: |
          set -euo pipefail
          ROBOZIUM_HOME="$RUNNER_TEMP/robozium-home"
          sudo apt-get update
          sudo apt-get install -y xvfb ./desktop/release/robozium-desktop_*_amd64.deb
          # apt installs the rootless container engine with the app; nothing else needs setting up.
          dpkg-deb --field ./desktop/release/robozium-desktop_*_amd64.deb Depends | grep -qw podman
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
          mkdir -p "$ROBOZIUM_HOME"
          # A fresh home: the installed app keeps its profile in ~/.config/Robozium.
          # The runner sets XDG_CONFIG_HOME, which Electron prefers over HOME.
          HOME="$ROBOZIUM_HOME" XDG_CONFIG_HOME="$ROBOZIUM_HOME/.config" \
            xvfb-run -a robozium --mock > "$RUNNER_TEMP/robozium.log" 2>&1 &
          ready=""
          for _ in $(seq 1 180); do
            if curl -fsS -H "Origin: robozium://app" http://127.0.0.1:18000/ready >/dev/null 2>&1; then ready=yes; break; fi
            sleep 5
          done
          test -n "$ready" || { echo "The installed app's backend never became ready."; exit 1; }
          test -d "$ROBOZIUM_HOME/.config/Robozium/mock/hub" || { echo "The profile is not in ~/.config/Robozium."; exit 1; }
          # Quitting stops this installation's container; nothing keeps running.
          kill -TERM "$(pgrep -o -x robozium)"
          for _ in $(seq 1 60); do pgrep -x robozium >/dev/null || break; sleep 1; done
          if pgrep -x robozium >/dev/null; then echo "The installed app did not exit."; exit 1; fi
          test -z "$(podman ps --quiet --filter label=fi.tachion.robozium.desktop.project)" || { echo "The API container is still running."; exit 1; }
      - name: Fetch the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node desktop/packaging/apt-repository.mjs previous previous-release
      - name: Upgrade from the latest release and keep user data
        env:
          UPGRADE_LOG: ${{ runner.temp }}/robozium.log
        # Before the first release, this build is reinstalled over itself.
        run: |
          old="$(ls previous-release/*.deb 2>/dev/null || ls desktop/release/robozium-desktop_*_amd64.deb)"
          node desktop/packaging/check-upgrade.mjs "$old" desktop/release/robozium-desktop_*_amd64.deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: linux-package-reports
          path: |
            ${{ runner.temp }}/robozium.log
            ${{ runner.temp }}/robozium-home/.config/Robozium/mock/.runtime/
          include-hidden-files: true
          retention-days: 7
